id = "herdr-omo-toolbox"
name = "OmO Toolbox"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "OmO toolbox: live agents and tasks boards, automatic tab titles with agent icons and status, and alt-tab to the last tab"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/check-runtime.sh"]

# Herdr resolves a relative argv[0] against the pane cwd, so the pane command
# resolves the launcher from the injected plugin root instead.
[[panes]]
id = "board"
title = "OmO Agents"
description = "Live board of OmO subagents and DAG runs"
placement = "popup"
width = "92%"
height = "88%"
command = ["/bin/sh", "-c", "exec \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/bin/agents-board\""]

[[panes]]
id = "side"
title = "OmO Agents"
description = "Live board of OmO subagents and DAG runs"
placement = "split"
command = ["/bin/sh", "-c", "exec \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/bin/agents-board\""]

[[actions]]
id = "open"
title = "OmO Agents"
description = "Open the OmO agents board as a popup"
contexts = ["global", "workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-omo-toolbox", "--entrypoint", "board", "--focus"]

[[actions]]
id = "open-split"
title = "OmO Agents (split)"
description = "Open the OmO agents board in a split to the right"
contexts = ["global", "workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-omo-toolbox", "--entrypoint", "side", "--placement", "split", "--direction", "right", "--no-focus"]

[[actions]]
id = "open-tab"
title = "OmO Agents (tab)"
description = "Open the OmO agents board in its own tab"
contexts = ["global", "workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-omo-toolbox", "--entrypoint", "side", "--placement", "tab", "--focus"]

[[actions]]
id = "open-tasks"
title = "OmO Tasks"
description = "Open the OmO tasks board as a popup"
contexts = ["global", "workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-omo-toolbox", "--entrypoint", "board", "--focus", "--env", "OMO_BOARD_VIEW=tasks"]

[[actions]]
id = "open-tasks-split"
title = "OmO Tasks (split)"
description = "Open the OmO tasks board in a split to the right"
contexts = ["global", "workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-omo-toolbox", "--entrypoint", "side", "--placement", "split", "--direction", "right", "--no-focus", "--env", "OMO_BOARD_VIEW=tasks"]

[[actions]]
id = "open-tasks-tab"
title = "OmO Tasks (tab)"
description = "Open the OmO tasks board in its own tab"
contexts = ["global", "workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-omo-toolbox", "--entrypoint", "side", "--placement", "tab", "--focus", "--env", "OMO_BOARD_VIEW=tasks"]

[[startup]]
command = ["bin/tabs", "ensure"]

[[events]]
on = "pane.agent_detected"
command = ["bin/tabs", "ensure"]

[[actions]]
id = "last-tab"
title = "Last tab"
description = "Jump back to the previously focused tab (alt-tab)"
contexts = ["global"]
command = ["bin/tabs", "last-tab"]

[[actions]]
id = "tabs-start"
title = "Start tab titles"
description = "Start automatic tab titles"
contexts = ["global"]
command = ["bin/tabs", "ensure"]

[[actions]]
id = "tabs-stop"
title = "Stop tab titles"
description = "Stop automatic tab titles and strip icons/status from tabs it named"
contexts = ["global"]
command = ["bin/tabs", "stop"]
